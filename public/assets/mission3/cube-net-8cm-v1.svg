<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
  <title id="title">แบบคลี่กล่องลูกบาศก์ขนาด 8 คูณ 8 คูณ 8 เซนติเมตร</title>
  <desc id="desc">เส้นทึบใช้สำหรับตัด เส้นประใช้สำหรับพับ และทุกหน้าของกล่องมีขนาด 8 คูณ 8 เซนติเมตร</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#654b2d" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#267c72"/>
    </marker>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f4d7a1"/>
      <path d="M0 4h16M2 12h12" stroke="#d7aa68" stroke-width=".45" opacity=".35"/>
    </pattern>
  </defs>
  <g filter="url(#shadow)">
    <path d="M150 180H255V75H360V180H570V285H360V390H255V285H150Z" fill="url(#paper)" stroke="#3f3a32" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#efd19a" stroke="#3f3a32" stroke-width="3" stroke-linejoin="round">
      <path d="M255 75l12-30h81l12 30z"/>
      <path d="M255 75l-25 15v75l25 15z"/>
      <path d="M360 75l25 15v75l-25 15z"/>
      <path d="M255 390l12 30h81l12-30z"/>
      <path d="M255 285l-25 15v75l25 15z"/>
      <path d="M360 285l25 15v75l-25 15z"/>
      <path d="M150 180l-27 15v75l27 15z"/>
      <path d="M570 180l27 15v75l-27 15z"/>
    </g>
    <g fill="none" stroke="#16877e" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round">
      <path d="M255 75v105M360 75v105M255 180h105M255 285h105M255 285v105M360 285v105"/>
      <path d="M255 75h105M255 390h105M255 75v105M360 75v105M255 285v105M360 285v105M150 180v105M570 180v105"/>
      <path d="M255 180v105M360 180v105M465 180v105"/>
    </g>
  </g>
  <g fill="#267c72" font-family="Tahoma, sans-serif" font-size="17" font-weight="700">
    <path d="M165 315h78" stroke="#267c72" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="204" y="340" text-anchor="middle">8 ซม.</text>
    <path d="M615 190v85" stroke="#267c72" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="632" y="238">8 ซม.</text>
  </g>
  <g font-family="Tahoma, sans-serif" font-size="18" font-weight="700">
    <path d="M170 470h72" stroke="#3f3a32" stroke-width="4"/>
    <text x="252" y="476" fill="#4c4337">เส้นทึบ = ตัด</text>
    <path d="M405 470h72" stroke="#16877e" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="487" y="476" fill="#267c72">เส้นประ = พับ</text>
  </g>
</svg>
